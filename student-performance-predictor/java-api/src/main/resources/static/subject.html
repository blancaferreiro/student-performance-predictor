<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaturas - Student Performance Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <h1>Subjects</h1>
        <p class="introduction"><a href="/">← Back to students</a></p>

        <section class="panel">
            <h2>Add subject</h2>
            <form id="subject-form">
                <label for="subject-name">Name</label>
                <input id="subject-name" type="text" required>

                <label for="subject-difficulty">Difficulty</label>
                <select id="subject-difficulty" required>
                    <option value="" disabled selected>Select a difficulty</option>
                    <option value="EASY">Easy</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HARD">Hard</option>
                </select>

                <div class="form-actions">
                    <button type="submit">Save subject</button>
                </div>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Registered subjects</h2>
            <div id="subject-list"></div>
        </section>
    </main>
    <script src="/subject.js"></script>
</body>
</html>
