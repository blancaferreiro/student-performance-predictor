services:

  python-service:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studentdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"          # solo para ejecutar Java con mvn en local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  java-api:
    build:
      context: ./java-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PYTHON_SERVICE_URL: http://python-service:8000
      DB_URL: jdbc:mysql://mysql:3306/studentdb
      DB_USER: app
      DB_PASSWORD: app
    depends_on:
      python-service:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
