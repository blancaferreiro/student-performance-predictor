<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Courses - Student Performance Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <div class="inner">
            <h1>Academic Courses</h1>
            <p class="introduction">Register and manage academic years for subjects and enrollments.</p>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a class="header-link" href="/">← Back to students</a>
                <a class="header-link" href="/subjects">Manage subjects →</a>
            </div>
        </div>
    </header>
    <main>
        <section class="panel">
            <h2 id="form-title">Add academic course</h2>
            <form id="course-form">
                <input id="course-id" type="hidden">

                <label for="course-name">Course name (e.g. 2025/2026)</label>
                <input id="course-name" type="text" placeholder="2025/2026" required>

                <label for="course-start-date">Start date</label>
                <input id="course-start-date" type="date" required>

                <label for="course-end-date">End date</label>
                <input id="course-end-date" type="date" required>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Save course</button>
                    <button id="cancel-edit" class="secondary hidden" type="button">Cancel edit</button>
                </div>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Registered academic courses</h2>
            <div id="course-list"></div>
        </section>
    </main>
    <script src="/courses.js"></script>
</body>
</html>
